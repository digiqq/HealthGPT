name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build HealthGPT.ipa
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app (no signing)
        run: |
          xcodebuild \
            -project HealthGPT.xcodeproj \
            -scheme HealthGPT \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/HealthGPT.app" Payload/
          zip -r HealthGPT.ipa Payload
          ls -lh HealthGPT.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HealthGPT-ipa
          path: HealthGPT.ipa
          if-no-files-found: error
